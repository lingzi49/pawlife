<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PawLife · 宠物健康管理展示版</title>
  <meta name="description" content="PawLife 宠物健康管理产品展示版：数字档案、个性化营养、健康记录、体重趋势、照护提醒与成长激励。演示数据仅保存在本地浏览器。" />
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/dashboard">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <ellipse cx="6.2" cy="10.2" rx="2.1" ry="2.7" transform="rotate(-18 6.2 10.2)"/>
            <ellipse cx="10" cy="6.6" rx="2.1" ry="2.8"/>
            <ellipse cx="14.4" cy="6.6" rx="2.1" ry="2.8"/>
            <ellipse cx="18" cy="10.4" rx="2.1" ry="2.7" transform="rotate(18 18 10.4)"/>
            <path d="M12.1 12.2c2.4 0 4.3 1.7 4.5 3.6.2 1.6-1.1 2.7-2.7 2.5-.8-.1-1.2-.4-1.8-.4s-1 .3-1.8.4c-1.6.2-2.9-.9-2.7-2.5.2-1.9 2.1-3.6 4.5-3.6Z"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">PawLife</div>
          <div class="brand-tag">宠物健康管理</div>
        </div>
      </a>

      <div class="sidebar-label">工作台</div>
      <nav class="sidebar-nav" id="sidebarNav" aria-label="主导航">
        <a href="#/dashboard" data-route="dashboard"><span class="nav-ico" data-icon="home"></span><span>首页</span></a>
        <a href="#/profile" data-route="profile"><span class="nav-ico" data-icon="profile"></span><span>宠物档案</span></a>
        <a href="#/nutrition" data-route="nutrition"><span class="nav-ico" data-icon="bowl"></span><span>营养管理</span></a>
        <a href="#/records" data-route="records"><span class="nav-ico" data-icon="clipboard"></span><span>健康记录</span></a>
        <a href="#/trends" data-route="trends"><span class="nav-ico" data-icon="chart"></span><span>健康趋势</span></a>
        <a href="#/reminders" data-route="reminders"><span class="nav-ico" data-icon="bell"></span><span>照护提醒</span><span class="nav-badge" id="navReminderBadge">0</span></a>
        <a href="#/growth" data-route="growth"><span class="nav-ico" data-icon="trophy"></span><span>成长与激励</span></a>
      </nav>

      <div class="sidebar-pet" id="sidebarPet">
        <img src="assets/images/tuantuan.svg" alt="演示宠物团团头像" />
        <div>
          <b>团团</b>
          <span>柯基 · 演示档案</span>
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="demo-note">
          <strong>产品展示版</strong>
          <p>所有数据均为虚构演示数据，操作仅保存在当前浏览器 localStorage。</p>
        </div>
        <button type="button" class="sidebar-reset" id="resetDemoBtn">
          <span data-icon="reset"></span>重置演示数据
        </button>
      </div>
    </aside>

    <div class="sidebar-scrim" id="sidebarScrim"></div>

    <div class="app-main">
      <header class="topbar">
        <button type="button" class="icon-btn menu-btn" id="menuBtn" aria-label="打开导航">
          <span data-icon="menu"></span>
        </button>
        <div class="topbar-heading">
          <div class="topbar-eyebrow">PawLife 工作台</div>
          <h1 id="topbarTitle">首页</h1>
          <p id="topbarSubtitle">今天也要照顾好团团</p>
        </div>
        <div class="topbar-actions">
          <span class="date-chip" id="topbarDate"></span>
          <button type="button" class="stat-chip" id="streakChip" title="查看连续签到">
            <span aria-hidden="true">🔥</span><b>0</b><em>连续签到</em>
          </button>
          <button type="button" class="stat-chip" id="pointsChip" title="查看爪印积分">
            <span aria-hidden="true">🐾</span><b>0</b><em>爪印</em>
          </button>
          <button type="button" class="avatar-btn" id="avatarBtn" aria-label="查看宠物档案">
            <img src="assets/images/tuantuan.svg" alt="" />
          </button>
        </div>
      </header>

      <main class="content" id="view" tabindex="-1"></main>

      <footer class="app-footer">
        <p>PawLife 产品展示版 · 演示数据不会写入原应用数据库</p>
        <p>健康建议与提醒仅作日常照护参考，不构成兽医诊断或治疗建议。</p>
      </footer>
    </div>
  </div>

  <div id="toastRoot" class="toast-root" aria-live="polite" aria-atomic="false"></div>
  <div id="modalRoot"></div>

  <noscript>
    <div class="noscript">PawLife 展示版需要启用 JavaScript 才能查看交互内容。</div>
  </noscript>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/nutrition.js"></script>
  <script src="js/health.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/gamification.js"></script>
</body>
</html>
